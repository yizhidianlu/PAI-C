[project]
name = "paic"
version = "0.1.0"
description = "Paper All-in-Claude: Claude Code skill set + MCP server for STEM paper workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PAI-C" }]
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "mcp>=1.2.0",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "python-ulid>=2.7.0",
    "rapidfuzz>=3.9.0",
    "rank-bm25>=0.2.2",
    "platformdirs>=4.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pypdf>=4.0",
]

[project.scripts]
paic = "paic.cli:main"
paic-mcp = "paic.mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paic"]

[tool.hatch.build.targets.wheel.force-include]
"src/paic/latex/templates" = "paic/latex/templates"
"src/paic/llm/prompts" = "paic/llm/prompts"
"src/paic/personas" = "paic/personas"
# NOTE: src/paic/web/ is an out-of-tree local workbench (intentionally
# never tracked). It is NOT shipped with the wheel and has no entry-point;
# run it locally via ``python -m paic.web.server`` if you have the dir.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
